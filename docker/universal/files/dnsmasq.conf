log-queries

# Do not read /etc/resolv.conf
no-resolv

# Do not watch /etc/resolv.conf for changes
no-poll

# Redirect all domains to the proxy gateway (this container)
address=/#/172.20.0.1

# Answer every AAAA query with :: so nothing reaches a step over IPv6
address=/#/::

# Answer only queries from the local subnets, never forward a reverse lookup
# for a private range upstream, and ignore /etc/hosts.
local-service
bogus-priv
no-hosts

port=53

# Drop privileges after binding to port 53
user=dnsmasq
group=dnsmasq

bind-interfaces
listen-address=0.0.0.0

cache-size=1000

# "-" sends the log to stderr, so the lines land in the container's own output
log-facility=-
