# Test-only counterpart to compose.action.yaml, used only via
# BUILDCAGE_TEST_COMPOSE_FILE (see
# src/core/lib/provenance/local-image-override.ts) by this repo's own
# universal-engine integration tests. Adds the one thing a published action
# has no reason to know about: a second network joining the fixture origin
# started by ../compose.test-universal.yaml. Unlike
# compose.action.test-inspect.yaml, there is no CA cert to trust: the
# universal engine never terminates TLS.
#
# BUILDCAGE_TEST_COMPOSE_FILE only takes effect at all when
# BUILDCAGE_BUILD_TEST_HOOKS=1 was set at build time (see
# readLocalImageOverride in src/lib/compose-file.ts); without that flag the
# override is unreachable, and therefore irrelevant, in a published action's
# dist/main.cjs.
services:
  proxy:
    container_name: ${PROXY_CONTAINER_NAME:-buildcage-proxy}
    image: ${BUILDCAGE_PROXY_IMAGE_REF:-placeholder}
    cap_add:
      - NET_ADMIN
    environment:
      - PROXY_MODE=${PROXY_MODE:-restrict}
      - ALLOWED_HTTPS_RULES=${ALLOWED_HTTPS_RULES:-}
      - ALLOWED_HTTP_RULES=${ALLOWED_HTTP_RULES:-}
      - ALLOWED_IP_RULES=${ALLOWED_IP_RULES:-}
      # The test-dns fixture's address on test-net (../compose.test-universal.yaml).
      - EXTERNAL_RESOLVER=10.200.0.53
      # Overridable because test/integration-test-concurrent.sh puts two
      # proxies on this network at once, and they cannot share an address.
      - TEST_NET_ADDR=${TEST_NET_ADDR:-10.200.0.2/24}
      - TEST_NET_SUBNET=${TEST_NET_SUBNET:-10.210.0.0/24}
      # What the action computed, plus a fixture address nothing answers on so
      # the blocked-name scenario has a deterministic target.
      - HOST_ADDRESSES=${HOST_ADDRESSES:-} 10.200.0.199
    volumes:
      - ../test/test-net-addr/attach.sh:/test-hooks/attach-test-net-addr.sh:ro
    # Wrapped here rather than in the image: the proxy is the product image
    # and carries no test-only setup.
    entrypoint: ["/test-hooks/attach-test-net-addr.sh", "/init"]
    networks:
      default:
      test-net:
    labels:
      io.buildcage.owner: ${BUILDCAGE_OWNER:-}
    # `--wait` would otherwise return on "running" alone. Runs every service's
    # own s6 check: the resolver starts in parallel with HAProxy, so probing
    # HAProxy alone would pass while DNS is still coming up. No restart policy
    # goes with it: a container that stopped itself has to stay stopped for the
    # wait to see it.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'for check in /etc/s6-overlay/s6-rc.d/*/data/check; do "$$check" || exit 1; done',
        ]
      interval: 30s
      # Every start pays this before the first probe, and the tree is ready in ~0.3s.
      start_interval: 250ms
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  test-net:
    # Must match ../compose.test-*.yaml's own name, suffix included.
    name: buildcage-test-universal-net${BUILDCAGE_WORKTREE_SUFFIX:-}
    external: true
